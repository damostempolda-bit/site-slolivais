<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Administração - SL Olivais</title>
  <!-- Script de identidad obligatorio -->
  </script>
</head>
<body>
  <!-- Script principal de Decap CMS -->
  <script src="https://unpkg.com@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // Inicializa el sistema de login si no abre automáticamente
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
